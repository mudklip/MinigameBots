plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

subprojects {
	apply plugin: 'net.fabricmc.fabric-loom'

	version = project.mod_version
	group = project.maven_group

	base {
		archivesName = project.name == 'client' ? 'minigamebots' : "minigamebots-${project.name}"
	}

	repositories {
		mavenCentral()
	}

	dependencies {
		minecraft "com.mojang:minecraft:${project.minecraft_version}"
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

		testImplementation platform("org.junit:junit-bom:${project.junit_version}")
		testImplementation 'org.junit.jupiter:junit-jupiter'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	}

	processResources {
		def props = [version: project.version, minecraft_version: project.minecraft_version,
		             loader_version: project.loader_version]
		inputs.properties props
		filesMatching('fabric.mod.json') {
			expand props
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
		it.options.encoding = 'UTF-8'
	}

	java {
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}

	test {
		useJUnitPlatform()
	}
}
